name: Verify portfolio site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEDUSA_BACKEND_URL: http://127.0.0.1:9011
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_catalog
      NEXT_PUBLIC_DEFAULT_REGION: us
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the application
        run: |
          corepack enable
          yarn install --immutable
          yarn tsc --noEmit
          node --input-type=module <<'JS' &
          import { createServer } from 'node:http';
          const region = { id: 'reg_ci', name: 'US', currency_code: 'usd', countries: [{ iso_2: 'us', display_name: 'United States' }] };
          const catalog = {
            '/store/regions': { regions: [region] }, '/store/regions/reg_ci': { region },
            '/store/products': { products: [], count: 0 }, '/store/collections': { collections: [], count: 0 },
            '/store/product-categories': { product_categories: [] }, '/store/shipping-options': { shipping_options: [] },
          };
          createServer((req, res) => {
            const data = catalog[new URL(req.url, 'http://localhost').pathname];
            res.writeHead(data ? 200 : 404, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify(data ?? { message: 'Unknown test catalog endpoint' }));
          }).listen(9011, '127.0.0.1');
          JS
          yarn build
          yarn start > /tmp/storefront.log 2>&1 &
          curl --retry 15 --retry-all-errors --retry-delay 1 -b "" -fsSL http://localhost:8000/us -o /tmp/storefront.html || { tail -40 /tmp/storefront.log; exit 1; }
          grep -Fq 'Browse the collection' /tmp/storefront.html
          curl --retry 15 --retry-all-errors --retry-delay 1 -b "" -fsSL http://localhost:8000/us -o /tmp/portfolio-home.html
          npm install --prefix "$RUNNER_TEMP/site-check" --no-audit --no-fund playwright-core@1.65.1
          cat > "$RUNNER_TEMP/site-check/check.cjs" <<'JS'
          const { chromium } = require("playwright-core");
          (async () => {
            const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true });
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on("pageerror", err => errors.push(err.message));
              for (const width of [1440, 390]) {
                await page.setViewportSize({ width, height: 900 });
                await page.goto("http://localhost:8000/us", { waitUntil: "domcontentloaded" });
                await page.locator("body").waitFor();
                if (!(await page.title()).includes("Flint") && !(await page.locator("body").innerText()).includes("Flint & Fibre")) throw Error("Missing site identity");
                await page.screenshot({ path: process.env.RUNNER_TEMP + "/site-" + width + ".png", animations: "disabled" });
              }
              if (errors.length) throw Error(errors.join("\n"));
            } finally { await browser.close(); }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          JS
          node "$RUNNER_TEMP/site-check/check.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: site-previews
          path: ${{ runner.temp }}/site-*.png
          retention-days: 14
